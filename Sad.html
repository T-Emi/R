<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سایه‌دان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#020103;
    --ink:#0b0810;
    --panel:#0e0a15;
    --line:#241a35;
    --line-bright:#5a3fa0;
    --text:#e9e4f5;
    --text-dim:#6d6485;
    --violet:#8b3bff;
    --violet-2:#c084fc;
    --violet-glow:rgba(139,59,255,.55);
    --danger:#e14a63;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Vazirmatn',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow-x:hidden;
  }

  canvas#embers{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
  .vignette{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.65) 100%);
  }
  .flash{
    position:fixed;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(circle, rgba(192,132,252,.4), transparent 62%);
    opacity:0;
    transition:opacity .5s ease;
  }

  /* ---------- summoning circle ---------- */
  .circle-wrap{
    position:absolute;top:50%;left:50%;
    width:560px;height:560px;
    transform:translate(-50%,-50%);
    z-index:0;
    pointer-events:auto;
    cursor:pointer;
  }
  .circle-wrap svg{width:100%;height:100%;animation:spin 90s linear infinite;opacity:.45;transition:opacity .4s;}
  .circle-wrap svg.rev{animation:spinRev 130s linear infinite;position:absolute;inset:0;opacity:.28;}
  .circle-wrap.charge svg:not(.rev){animation-duration:2.4s;opacity:.9;filter:drop-shadow(0 0 22px var(--violet-glow));}
  .circle-wrap.awakened-glow svg:not(.rev){opacity:.6;}
  .circle-wrap.burst svg:not(.rev){animation-duration:1.1s;opacity:1;filter:drop-shadow(0 0 40px var(--violet-glow));}
  .circle-wrap.fail-flicker svg:not(.rev){filter:drop-shadow(0 0 16px rgba(225,74,99,.85));opacity:.7;}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes spinRev{from{transform:rotate(0)}to{transform:rotate(-360deg)}}

  .rune-ring{position:absolute;top:50%;left:50%;width:0;height:0;z-index:1;pointer-events:none;}
  .rune-dot{
    position:absolute;top:0;left:0;
    width:6px;height:6px;border-radius:50%;
    background:var(--line);
    transform:translate(-50%,-50%);
    transition:background .2s, box-shadow .2s;
    box-shadow:0 0 0 rgba(139,59,255,0);
  }
  .rune-dot.lit{background:var(--violet-2);box-shadow:0 0 9px var(--violet-glow);}

  .stage{position:relative;z-index:2;width:100%;max-width:420px;}

  /* ---------- GATE (dormant prompt) ---------- */
  .gate-prompt{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    cursor:pointer;
    z-index:3;
    transition:opacity .5s ease;
  }
  .gate-pulse{
    width:12px;height:12px;border-radius:50%;
    background:var(--violet);
    margin:0 auto 16px;
    animation:pulseDot 2.2s ease-out infinite;
  }
  @keyframes pulseDot{
    0%{box-shadow:0 0 0 0 rgba(139,59,255,.55);}
    70%{box-shadow:0 0 0 26px rgba(139,59,255,0);}
    100%{box-shadow:0 0 0 0 rgba(139,59,255,0);}
  }
  .gate-prompt p{color:var(--text-dim);font-size:13px;line-height:1.9;}

  /* ---------- LOCK CARD ---------- */
  .lock-wrap{width:100%;}
  .lock-card{
    position:relative;
    background:linear-gradient(180deg, rgba(14,10,21,.88), rgba(6,4,10,.94));
    border:1px solid var(--line);
    clip-path:polygon(0 18px, 18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
    padding:46px 38px 40px;
    text-align:center;
    backdrop-filter:blur(8px);
  }
  .lock-card::before{
    content:'';
    position:absolute;inset:0;
    clip-path:polygon(0 18px, 18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
    padding:1px;
    background:linear-gradient(135deg, var(--violet-2), transparent 40%, transparent 60%, var(--violet));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
    opacity:.7;
  }
  .lock-card{
    opacity:0;
    transform:translateY(14px) scale(.97);
    pointer-events:none;
    transition:opacity .55s ease, transform .55s ease;
  }
  .stage.awakened .lock-card{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-9px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(3px);}
  }
  .lock-card.fail{animation:shake .5s;}

  .brand-mark{width:46px;height:46px;margin:0 auto 18px;filter:drop-shadow(0 0 12px var(--violet-glow));}
  .brand-mark.enter-anim{animation:flicker-in 1.1s ease-out;}
  @keyframes flicker-in{
    0%{opacity:0;transform:scale(.6) rotate(-8deg);}
    55%{opacity:1;}
    70%{opacity:.4;}
    100%{opacity:1;transform:scale(1) rotate(0);}
  }

  .lock-card h1{
    font-size:15px;font-weight:700;letter-spacing:6px;
    color:var(--violet-2);text-transform:uppercase;
    margin-bottom:10px;
    text-shadow:0 0 18px var(--violet-glow);
  }
  .lock-card p.sub{color:var(--text-dim);font-size:13px;margin-bottom:28px;letter-spacing:.2px;}

  .field{margin-bottom:22px;text-align:right;position:relative;}
  .field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:8px;letter-spacing:1px;}
  .field input{
    width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
    padding:8px 2px 10px;color:var(--text);font-size:15px;font-family:inherit;outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .field input:focus{border-color:var(--violet);box-shadow:0 1px 0 0 var(--violet), 0 4px 14px -6px var(--violet-glow);}

  .incantation{
    font-family:'Cinzel',serif;
    font-size:11.5px;
    letter-spacing:1.5px;
    color:var(--violet-2);
    min-height:16px;
    margin-bottom:10px;
    opacity:0;
    transition:opacity .3s ease;
  }
  .incantation.show{opacity:1;}

  .btn{
    width:100%;
    background:linear-gradient(135deg, var(--violet), #4a1fa0);
    color:#fff;border:1px solid rgba(192,132,252,.5);
    clip-path:polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    padding:14px;font-size:14px;font-weight:700;letter-spacing:1px;font-family:inherit;
    cursor:pointer;
    box-shadow:0 0 0 rgba(139,59,255,0);
    transition:box-shadow .2s, filter .2s, transform .12s, opacity .2s;
    margin-top:6px;
  }
  .btn:hover{filter:brightness(1.15);box-shadow:0 0 28px -4px var(--violet-glow);}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.5;cursor:default;filter:none;box-shadow:none;}

  .err{color:var(--danger);font-size:12.5px;min-height:18px;margin-top:14px;}
  .lock-footer{text-align:center;margin-top:20px;font-size:12px;}
  .lock-footer a{color:var(--text-dim);cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
  .lock-footer a:hover{color:var(--violet-2);}

  /* ---------- VAULT ---------- */
  .vault-wrap{width:100%;max-width:680px;display:none;}
  .vault-wrap.active{display:block;}
  .lock-wrap.hidden{display:none;}
  .gate-prompt.hidden{display:none;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid var(--line);
  }
  .topbar-id{display:flex;align-items:center;gap:14px;}
  .brand-mark-sm{width:32px;height:32px;filter:drop-shadow(0 0 8px var(--violet-glow));flex:none;}
  .topbar h1{font-size:13px;font-weight:700;letter-spacing:4px;color:var(--violet-2);text-transform:uppercase;}
  .topbar .who{font-size:12px;color:var(--text-dim);margin-top:4px;}
  .icon-btn{
    background:transparent;border:1px solid var(--line);color:var(--text-dim);
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    padding:9px 18px;font-size:12.5px;font-family:inherit;cursor:pointer;
    transition:border-color .18s, color .18s;
  }
  .icon-btn:hover{color:var(--violet-2);border-color:var(--line-bright);}

  .dropzone{
    border:1px dashed var(--line);padding:36px 20px;text-align:center;
    color:var(--text-dim);font-size:13px;cursor:pointer;
    transition:border-color .18s, background .18s;
    margin-bottom:28px;
    background:linear-gradient(180deg, rgba(139,59,255,.03), transparent);
  }
  .dropzone.drag{border-color:var(--violet);background:rgba(139,59,255,.08);color:var(--text);}
  .dropzone strong{color:var(--violet-2);font-weight:700;}

  .file-row{
    display:flex;align-items:center;gap:14px;padding:15px 8px;
    border-bottom:1px solid var(--line);position:relative;transition:background .15s;
  }
  .file-row::before{content:'';position:absolute;right:0;top:0;bottom:0;width:2px;background:transparent;transition:background .15s;}
  .file-row:hover{background:linear-gradient(90deg, rgba(139,59,255,.06), transparent);}
  .file-row:hover::before{background:var(--violet);box-shadow:0 0 10px var(--violet-glow);}

  .file-icon{
    width:36px;height:36px;flex:none;background:var(--ink);border:1px solid var(--line);
    clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
    display:flex;align-items:center;justify-content:center;
    font-size:9.5px;color:var(--violet-2);font-weight:700;font-family:'Cinzel',serif;
  }
  .file-meta{flex:1;min-width:0;}
  .file-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .file-sub{font-size:11.5px;color:var(--text-dim);margin-top:3px;}
  .file-actions{display:flex;gap:8px;flex:none;}
  .file-actions button{
    background:transparent;border:1px solid var(--line);color:var(--text-dim);
    padding:7px 13px;font-size:12px;font-family:inherit;cursor:pointer;
    transition:color .15s, border-color .15s;
  }
  .file-actions button:hover{color:var(--violet-2);border-color:var(--line-bright);}
  .file-actions button.del:hover{color:var(--danger);border-color:var(--danger);}

  .empty{text-align:center;color:var(--text-dim);font-size:13px;padding:36px 0;}

  #fileInput{display:none;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);
    background:var(--panel);border:1px solid var(--line-bright);color:var(--text);
    padding:11px 22px;font-size:13px;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:6;
    box-shadow:0 0 24px -4px var(--violet-glow);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){
    .circle-wrap svg,.brand-mark.enter-anim,.gate-pulse{animation:none;}
  }
  @media (max-width:480px){
    .circle-wrap{display:none;}
    .lock-card{padding:38px 24px 32px;}
  }
</style>
</head>
<body>

<canvas id="embers"></canvas>
<div class="vignette"></div>
<div class="flash" id="flash"></div>

<div class="circle-wrap" id="circleWrap">
  <div class="rune-ring" id="runeRing"></div>
  <svg viewBox="0 0 200 200" fill="none">
    <circle cx="100" cy="100" r="96" stroke="#8b3bff" stroke-width="0.6" stroke-dasharray="2 6"/>
    <circle cx="100" cy="100" r="80" stroke="#c084fc" stroke-width="0.4"/>
    <g stroke="#8b3bff" stroke-width="0.5" opacity="0.8">
      <path d="M100 20 L106 34 L94 34 Z"/>
      <path d="M180 100 L166 106 L166 94 Z"/>
      <path d="M100 180 L94 166 L106 166 Z"/>
      <path d="M20 100 L34 94 L34 106 Z"/>
    </g>
    <circle cx="100" cy="100" r="60" stroke="#8b3bff" stroke-width="0.35" opacity="0.5"/>
  </svg>
  <svg class="rev" viewBox="0 0 200 200" fill="none">
    <circle cx="100" cy="100" r="70" stroke="#c084fc" stroke-width="0.3" stroke-dasharray="1 4"/>
  </svg>
</div>

<div class="stage" id="stage">

  <div class="gate-prompt" id="gatePrompt">
    <div class="gate-pulse"></div>
    <p>برای گشودن مهر،<br>دایره را لمس کن</p>
  </div>

  <div class="lock-wrap" id="lockWrap">
    <div class="lock-card">
      <svg class="brand-mark" id="brandMark" viewBox="0 0 46 46" fill="none">
        <path d="M23 4 L29 21 L23 42 L17 21 Z" fill="#8b3bff"/>
        <circle cx="23" cy="20" r="2.2" fill="#e9e4f5"/>
        <circle cx="23" cy="23" r="20" stroke="#c084fc" stroke-width="0.7" opacity="0.5"/>
      </svg>
      <h1 id="lockTitle">سایه‌دان</h1>
      <p class="sub" id="lockSub">آنچه در سایه پنهان است، تنها با مهر تو آشکار می‌شود</p>

      <div id="setupFields">
        <div class="field">
          <label>نام کاربری</label>
          <input type="text" id="setUser" autocomplete="off">
        </div>
        <div class="field">
          <label>رمز عبور</label>
          <input type="password" id="setPass1">
        </div>
        <div class="field">
          <label>تکرار رمز عبور</label>
          <input type="password" id="setPass2">
        </div>
        <div class="incantation" id="incantation"></div>
        <button class="btn" id="setupBtn">مهر و موم کن</button>
      </div>

      <div id="loginFields" style="display:none;">
        <div class="field">
          <label>نام کاربری</label>
          <input type="text" id="loginUser" autocomplete="off">
        </div>
        <div class="field">
          <label>رمز عبور</label>
          <input type="password" id="loginPass">
        </div>
        <div class="incantation" id="incantation2"></div>
        <button class="btn" id="loginBtn">ورود به سایه</button>
      </div>

      <div class="err" id="lockErr"></div>

      <div class="lock-footer" id="resetRow" style="display:none;">
        <a id="resetLink">رمز را فراموش کردی؟ سایه‌دان را از نو بساز</a>
      </div>
    </div>
  </div>

  <div class="vault-wrap" id="vaultWrap">
    <div class="topbar">
      <div class="topbar-id">
        <svg class="brand-mark-sm" viewBox="0 0 46 46" fill="none">
          <path d="M23 4 L29 21 L23 42 L17 21 Z" fill="#8b3bff"/>
          <circle cx="23" cy="20" r="2.2" fill="#e9e4f5"/>
        </svg>
        <div>
          <h1>سایه‌دان</h1>
          <div class="who" id="whoLabel"></div>
        </div>
      </div>
      <button class="icon-btn" id="logoutBtn">خروج</button>
    </div>

    <div class="dropzone" id="dropzone">
      <strong>فایل را در سایه رها کن</strong> یا کلیک کن برای انتخاب
    </div>
    <input type="file" id="fileInput" multiple>

    <div class="file-list" id="fileList"></div>
    <div class="empty" id="emptyState" style="display:none;">هنوز چیزی به سایه سپرده نشده.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- Ember particle field ---------------- */
(function(){
  const canvas = document.getElementById('embers');
  const ctx = canvas.getContext('2d');
  let w, h, particles = [];
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  function makeParticle(){
    return {
      x: Math.random()*w, y: h + Math.random()*100,
      r: 0.6 + Math.random()*1.8,
      speed: 0.15 + Math.random()*0.35,
      drift: (Math.random()-0.5)*0.3,
      alpha: 0.15 + Math.random()*0.35,
      hue: Math.random() > 0.5 ? '139,59,255' : '192,132,252'
    };
  }
  const COUNT = reduced ? 0 : 46;
  for (let i=0;i<COUNT;i++) particles.push(makeParticle());

  let burstParticles = [];
  window.emberBurst = function(){
    if (reduced) return;
    for (let i=0;i<70;i++){
      const angle = Math.random()*Math.PI*2;
      const speed = 2 + Math.random()*5;
      burstParticles.push({
        x: w/2, y: h/2,
        vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
        r: 1 + Math.random()*2, life: 1,
        hue: Math.random() > 0.5 ? '139,59,255' : '192,132,252'
      });
    }
  };

  function tick(){
    ctx.clearRect(0,0,w,h);
    for (const p of particles){
      p.y -= p.speed; p.x += p.drift;
      if (p.y < -20){ Object.assign(p, makeParticle()); p.y = h + 20; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${p.hue},${p.alpha})`;
      ctx.shadowColor = `rgba(${p.hue},0.9)`; ctx.shadowBlur = 6;
      ctx.fill();
    }
    burstParticles = burstParticles.filter(p => p.life > 0.02);
    for (const p of burstParticles){
      p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life *= 0.95;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${p.hue},${p.life})`;
      ctx.shadowColor = `rgba(${p.hue},0.9)`; ctx.shadowBlur = 10;
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();
})();

/* ---------------- IndexedDB layer ---------------- */
const DB_NAME = 'private_vault_db';
const DB_VERSION = 1;
let dbP = new Promise((resolve, reject) => {
  const req = indexedDB.open(DB_NAME, DB_VERSION);
  req.onupgradeneeded = e => {
    const db = e.target.result;
    if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
    if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
  };
  req.onsuccess = e => resolve(e.target.result);
  req.onerror = e => reject(e.target.error);
});

async function idbGet(store, key) {
  const db = await dbP;
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly').objectStore(store).get(key);
    tx.onsuccess = () => res(tx.result);
    tx.onerror = () => rej(tx.error);
  });
}
async function idbPut(store, val) {
  const db = await dbP;
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite').objectStore(store).put(val);
    tx.onsuccess = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbDelete(store, key) {
  const db = await dbP;
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite').objectStore(store).delete(key);
    tx.onsuccess = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGetAll(store) {
  const db = await dbP;
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly').objectStore(store).getAll();
    tx.onsuccess = () => res(tx.result);
    tx.onerror = () => rej(tx.error);
  });
}
async function idbClear(store) {
  const db = await dbP;
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite').objectStore(store).clear();
    tx.onsuccess = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

/* ---------------- Crypto helpers ---------------- */
const enc = new TextEncoder();
const dec = new TextDecoder();

async function deriveKey(password, saltB64) {
  const salt = base64ToBuf(saltB64);
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}
function randomB64(len) {
  const arr = crypto.getRandomValues(new Uint8Array(len));
  return bufToBase64(arr);
}
function bufToBase64(buf) {
  const bytes = buf instanceof ArrayBuffer ? new Uint8Array(buf) : buf;
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function base64ToBuf(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function encryptBytes(key, dataBuf) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, dataBuf);
  return { iv: bufToBase64(iv), data: ct };
}
async function decryptBytes(key, ivB64, ctBuf) {
  const iv = base64ToBuf(ivB64);
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ctBuf);
}

/* ---------------- Ritual / gate state ---------------- */
const el = id => document.getElementById(id);
const stageEl = el('stage');
const circleWrap = el('circleWrap');
const gatePrompt = el('gatePrompt');
let awakened = false;

const DOT_COUNT = 16;
const DOT_RADIUS = 236;
const runeRing = el('runeRing');
for (let i = 0; i < DOT_COUNT; i++) {
  const d = document.createElement('div');
  d.className = 'rune-dot';
  const angle = (i / DOT_COUNT) * Math.PI * 2 - Math.PI / 2;
  d.style.left = (Math.cos(angle) * DOT_RADIUS) + 'px';
  d.style.top = (Math.sin(angle) * DOT_RADIUS) + 'px';
  runeRing.appendChild(d);
}
function updateDots(len) {
  runeRing.querySelectorAll('.rune-dot').forEach((d, i) => d.classList.toggle('lit', i < len));
}

function awaken() {
  if (awakened) return;
  awakened = true;
  circleWrap.classList.add('charge');
  setTimeout(() => {
    circleWrap.classList.remove('charge');
    circleWrap.classList.add('awakened-glow');
  }, 900);
  circleWrap.style.pointerEvents = 'none';
  gatePrompt.classList.add('hidden-fade');
  gatePrompt.style.opacity = '0';
  setTimeout(() => gatePrompt.classList.add('hidden'), 500);
  stageEl.classList.add('awakened');
  setTimeout(() => {
    el('brandMark').classList.add('enter-anim');
    const visible = document.querySelector('#setupFields:not([style*="none"]) input, #loginFields:not([style*="none"]) input');
    if (visible) visible.focus();
  }, 350);
}
circleWrap.addEventListener('click', awaken);
gatePrompt.addEventListener('click', awaken);

function scrambleTo(node, finalText, duration) {
  const chars = 'ابجدهوزحطیکلمنسعفصقرشتثخذضظغپچژگABCDEFGHIJ0123456789';
  const len = finalText.length;
  const start = performance.now();
  node.classList.add('show');
  function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    let out = '';
    for (let i = 0; i < len; i++) {
      out += (t * len > i) ? finalText[i] : chars[Math.floor(Math.random() * chars.length)];
    }
    node.textContent = out;
    if (t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

async function ritualSuccess(username) {
  const activeInc = el('setupFields').style.display !== 'none' ? el('incantation') : el('incantation2');
  circleWrap.classList.add('burst');
  window.emberBurst();
  el('flash').style.opacity = '1';
  scrambleTo(activeInc, 'در حال گشودن مهر...', 550);
  await sleep(650);
  scrambleTo(activeInc, 'مهر گشوده شد، ' + username, 500);
  await sleep(750);
  el('flash').style.opacity = '0';
  circleWrap.classList.remove('burst');
  enterVault();
}

function ritualFail(msg) {
  showErr(msg);
  const card = document.querySelector('.lock-card');
  card.classList.add('fail');
  circleWrap.classList.add('fail-flicker');
  setTimeout(() => {
    card.classList.remove('fail');
    circleWrap.classList.remove('fail-flicker');
  }, 550);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ---------------- App state ---------------- */
let sessionKey = null;
let sessionUser = null;

function toast(msg) {
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
function showErr(msg) { el('lockErr').textContent = msg || ''; }

async function init() {
  awakened = false;
  stageEl.classList.remove('awakened');
  circleWrap.classList.remove('awakened-glow', 'charge', 'burst', 'fail-flicker');
  circleWrap.style.pointerEvents = 'auto';
  gatePrompt.classList.remove('hidden', 'hidden-fade');
  gatePrompt.style.opacity = '1';
  el('brandMark').classList.remove('enter-anim');
  el('incantation').textContent = ''; el('incantation').classList.remove('show');
  el('incantation2').textContent = ''; el('incantation2').classList.remove('show');
  updateDots(0);
  showErr('');

  const meta = await idbGet('meta', 'account');
  if (meta) {
    el('setupFields').style.display = 'none';
    el('loginFields').style.display = 'block';
    el('lockSub').textContent = 'مهرت را وارد کن تا سایه‌دان باز شود';
    el('resetRow').style.display = 'block';
    el('loginUser').value = meta.username;
  } else {
    el('setupFields').style.display = 'block';
    el('loginFields').style.display = 'none';
    el('resetRow').style.display = 'none';
  }
}
init();

el('setPass1').addEventListener('input', e => updateDots(Math.min(e.target.value.length, DOT_COUNT)));
el('loginPass').addEventListener('input', e => updateDots(Math.min(e.target.value.length, DOT_COUNT)));

el('setupBtn').addEventListener('click', async () => {
  showErr('');
  const username = el('setUser').value.trim();
  const p1 = el('setPass1').value;
  const p2 = el('setPass2').value;
  if (!username) return ritualFail('نام کاربری رو وارد کن.');
  if (p1.length < 4) return ritualFail('رمز باید حداقل ۴ کاراکتر باشه.');
  if (p1 !== p2) return ritualFail('رمزها یکی نیستن.');

  const salt = randomB64(16);
  const key = await deriveKey(p1, salt);
  const check = await encryptBytes(key, enc.encode('vault-ok'));
  await idbPut('meta', {
    key: 'account', username, salt,
    checkIv: check.iv, checkData: bufToBase64(check.data)
  });
  sessionKey = key;
  sessionUser = username;
  ritualSuccess(username);
});

el('loginBtn').addEventListener('click', async () => {
  showErr('');
  const meta = await idbGet('meta', 'account');
  const username = el('loginUser').value.trim();
  const pass = el('loginPass').value;
  if (!meta) return ritualFail('سایه‌دانی پیدا نشد.');
  if (username !== meta.username) return ritualFail('نام کاربری یا رمز اشتباهه.');

  try {
    const key = await deriveKey(pass, meta.salt);
    const plain = await decryptBytes(key, meta.checkIv, base64ToBuf(meta.checkData));
    if (dec.decode(plain) !== 'vault-ok') throw new Error('bad');
    sessionKey = key;
    sessionUser = username;
    ritualSuccess(username);
  } catch (e) {
    ritualFail('نام کاربری یا رمز اشتباهه.');
  }
});

el('resetLink').addEventListener('click', async () => {
  if (!confirm('با این کار همه فایل‌های ذخیره‌شده برای همیشه پاک می‌شن. مطمئنی؟')) return;
  await idbClear('meta');
  await idbClear('files');
  location.reload();
});

el('logoutBtn').addEventListener('click', () => {
  sessionKey = null;
  sessionUser = null;
  el('vaultWrap').classList.remove('active');
  el('lockWrap').classList.remove('hidden');
  el('loginPass').value = '';
  init();
});

function enterVault() {
  el('vaultWrap').classList.add('active');
  el('lockWrap').classList.add('hidden');
  el('whoLabel').textContent = 'حاضر: ' + sessionUser;
  renderFiles();
}

/* ---------------- File handling ---------------- */
const dropzone = el('dropzone');
const fileInput = el('fileInput');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => handleFiles(e.target.files));

async function handleFiles(fileListObj) {
  const files = Array.from(fileListObj);
  for (const f of files) {
    const buf = await f.arrayBuffer();
    const { iv, data } = await encryptBytes(sessionKey, buf);
    const id = 'f_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    await idbPut('files', { id, name: f.name, type: f.type || 'application/octet-stream', size: f.size, iv, data, added: Date.now() });
  }
  fileInput.value = '';
  toast(files.length > 1 ? 'فایل‌ها به سایه سپرده شدن' : 'فایل به سایه سپرده شد');
  renderFiles();
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('fa-IR') + ' ' + d.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
}
function extLabel(name) {
  const parts = name.split('.');
  return parts.length > 1 ? parts.pop().slice(0, 4).toUpperCase() : 'FILE';
}

async function renderFiles() {
  const files = (await idbGetAll('files')).sort((a, b) => b.added - a.added);
  const listEl = el('fileList');
  listEl.innerHTML = '';
  el('emptyState').style.display = files.length ? 'none' : 'block';

  for (const f of files) {
    const row = document.createElement('div');
    row.className = 'file-row';
    row.innerHTML = `
      <div class="file-icon">${extLabel(f.name)}</div>
      <div class="file-meta">
        <div class="file-name">${escapeHtml(f.name)}</div>
        <div class="file-sub">${fmtSize(f.size)} · ${fmtDate(f.added)}</div>
      </div>
      <div class="file-actions">
        <button class="dl">دانلود</button>
        <button class="del">حذف</button>
      </div>
    `;
    row.querySelector('.dl').addEventListener('click', () => downloadFile(f));
    row.querySelector('.del').addEventListener('click', () => deleteFile(f.id));
    listEl.appendChild(row);
  }
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function downloadFile(f) {
  try {
    const plain = await decryptBytes(sessionKey, f.iv, f.data);
    const blob = new Blob([plain], { type: f.type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) {
    toast('خطا در بازکردن فایل');
  }
}

async function deleteFile(id) {
  if (!confirm('این فایل برای همیشه پاک بشه؟')) return;
  await idbDelete('files', id);
  toast('فایل پاک شد');
  renderFiles();
}
</script>
